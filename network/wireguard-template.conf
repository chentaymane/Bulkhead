# =============================================================================
# WireGuard template — annotated for leak prevention
#
# Do NOT use this file as-is. Generate a real config from your VPN provider
# (Mullvad, IVPN, and Proton all emit WireGuard configs directly), then compare
# it against the notes here and fix anything that differs.
#
# Every setting below is annotated with what it does and how it leaks if wrong.
# =============================================================================

[Interface]

# Your private key. Generated by your provider, or locally with:
#   wg genkey | tee privatekey | wg pubkey > publickey
# Never share it, never commit it anywhere.
PrivateKey = <YOUR_PRIVATE_KEY>

# The address your provider assigns you inside the tunnel.
#
# LEAK WARNING: include the IPv6 address if your provider supports it. If you
# take only the IPv4 and your ISP gives you native IPv6, sites will reach you
# over IPv6 at your REAL address. This is the most common VPN leak there is.
Address = 10.64.0.2/32, fc00:bbbb:bbbb:bb01::1/128

# DNS resolver INSIDE the tunnel. Your provider's, not your ISP's, not a
# public one — one resolver, one story.
#
# LEAK WARNING: if this is unset, Windows falls back to the DHCP-assigned
# resolver from your ISP and every domain you visit is logged by them,
# regardless of the fact that your traffic is encrypted.
DNS = 10.64.0.1, fc00:bbbb:bbbb:bb01::1

# Optional: MTU. Leave unset unless you have problems. If large pages hang or
# uploads stall, try 1420, then 1380. Wrong MTU looks like a broken connection,
# not like a leak.
# MTU = 1420


[Peer]

# Your VPN server's public key.
PublicKey = <SERVER_PUBLIC_KEY>

# ===== THE MOST IMPORTANT LINE IN THIS FILE =====
#
# Routes ALL traffic — IPv4 and IPv6 — into the tunnel.
#
# LEAK WARNING: "0.0.0.0/0" alone routes only IPv4. IPv6 then bypasses the VPN
# entirely and leaks your real address. You need BOTH entries.
#
# Split tunneling (routing only some subnets) is convenient and a leak by
# design — do not use it in a privacy config.
AllowedIPs = 0.0.0.0/0, ::/0

# Server endpoint: address:port.
Endpoint = <SERVER_IP>:51820

# Keeps NAT mappings alive so the tunnel survives idle periods. 25s is standard.
# Without it, connections silently die behind CGNAT and some routers, and the
# reconnect is where leaks happen.
PersistentKeepalive = 25


# =============================================================================
# KILL SWITCH
# =============================================================================
#
# Preferred: use your VPN client's built-in kill switch. It handles reconnects,
# sleep/wake, and network changes properly. Turn it on and verify it.
#
# The wg-quick PostUp/PostDown approach below works on Linux/macOS but NOT on
# the Windows WireGuard client, which doesn't run these hooks the same way.
#
# On Windows, use one of:
#   1. Your provider's app kill switch  (easiest, recommended)
#   2. The WireGuard client's own "Block untunneled traffic (kill-switch)"
#      checkbox — available when AllowedIPs is 0.0.0.0/0, ::/0 exactly
#   3. Windows Firewall outbound rules — see ../scripts/Harden-Windows.ps1
#
# Option 2 is why AllowedIPs must be exactly "0.0.0.0/0, ::/0": the client only
# offers the kill switch when it can prove all traffic is tunneled.
#
# Linux/macOS reference rules:
# PostUp   = iptables -I OUTPUT ! -o %i -m mark ! --mark $(wg show %i fwmark) -m addrtype ! --dst-type LOCAL -j REJECT
# PostDown = iptables -D OUTPUT ! -o %i -m mark ! --mark $(wg show %i fwmark) -m addrtype ! --dst-type LOCAL -j REJECT
#
# =============================================================================
# AFTER CONNECTING — verify, in this order:
#
#   curl https://ifconfig.me            -> VPN IP, not yours
#   https://ipleak.net                  -> IPv4 AND IPv6 both VPN (or v6 absent)
#   https://dnsleaktest.com  (extended) -> only VPN resolvers, never your ISP
#   https://browserleaks.com/webrtc     -> no local IPs, no real public IP
#   pull the tunnel mid-download        -> traffic STOPS (kill switch works)
#
# If any of these fail, fix it before moving on to browser configuration.
# Browser hardening on top of a leaking tunnel is decoration.
# =============================================================================
